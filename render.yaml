services:
  # 1. Backend API Service (FastAPI)
  - type: web
    name: echoai-backend
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DB_PATH
        value: /var/data/echo.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: echo-data
      mountPath: /var/data
      sizeGB: 1

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: echoai-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: echoai-backend
          type: web
          property: host
